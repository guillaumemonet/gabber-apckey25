# Compositeur IA de GabberKey (optionnel) : un modèle de langage local servi par Ollama, que la fenêtre
# « Composer avec l'IA » interroge sur http://localhost:11434. Rien ne sort de la machine.
#
#   docker compose -f ai/docker-compose.yml up -d        (carte graphique NVIDIA)
#   docker compose -f ai/docker-compose.yml -f ai/docker-compose.cpu.yml up -d   (sans carte NVIDIA, plus lent)
#
# Au premier lancement, le service « pull » télécharge le modèle (environ 4,7 Go) puis s'arrête.
# GABBERKEY_MODEL choisit un autre modèle de la bibliothèque Ollama (il doit savoir répondre en JSON).
name: gabberkey-ai

services:
  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"          # accessible depuis cette machine seulement
    environment:
      OLLAMA_ORIGINS: "http://localhost:*,http://127.0.0.1:*"   # la page de GabberKey servie en local
      OLLAMA_KEEP_ALIVE: "15m"           # le modèle reste chargé entre deux demandes
    volumes:
      - models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  pull:
    image: ollama/ollama:0.40.12
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama", "pull", "${GABBERKEY_MODEL:-qwen2.5:7b}"]
    restart: "no"

volumes:
  models:
