name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifications statiques
        run: node tests/check.js
      - name: Carte son virtuelle (PulseAudio, sortie nulle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
      - name: Tests dans Firefox
        env:
          TEST_JOBS: 2
          TEST_TIMEOUT: 300
        run: node tests/run.js
