<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Guillaume Monet">
  <title>GabberKey</title>
  <link rel="stylesheet" href="css/style.css?v=48">
</head>
<body>
  <div id="start" class="overlay">
    <div class="overlay-box">
      <h1>Gabber<span>Key</span></h1>
      <p data-i18n="start.subtitle"></p>
      <button id="start-btn" class="primary" data-i18n="start.button"></button>
      <p class="hint" id="start-msg" data-i18n="start.hint"></p>
      <p class="hint credit">by Guillaume Monet</p>
    </div>
  </div>

  <header>
    <div class="brand">Gabber<span>Key</span></div>
    <div id="status" class="status off"><span class="dot"></span><span id="status-text" data-i18n="status.none"></span></div>
    <canvas id="meter" width="160" height="10" data-i18n-aria="meter.aria"></canvas>
    <label class="apc-page" data-i18n-title="apc.page.title"><span data-i18n="apc.page"></span><select id="apc-page"></select></label>
    <div class="spacer"></div>
    <label class="tempo" data-i18n-title="tempo.title">
      <input id="bpm" type="number" min="40" max="240" step="1" value="120"> BPM
    </label>
    <button id="tap" data-icon="tap" data-i18n-title="tap.title">Tap</button>
    <button id="rec" data-icon="rec" data-i18n-title="rec.title">REC</button>
    <button id="file-open" data-icon="folder" data-i18n="file.open" data-i18n-title="file.open.title"></button>
    <button id="file-save" data-icon="save" data-i18n="file.save" data-i18n-title="file.save.title"></button>
    <input id="file-input" type="file" accept=".gabber,application/json" hidden>
    <button id="panic" data-icon="panic" data-i18n="panic.label" data-i18n-title="panic.title"></button>
    <button id="layout-reset" class="icon-only" data-icon="layout" data-i18n-aria="layout.reset" data-i18n-title="layout.reset.title"></button>
    <button id="reset" class="icon-only" data-icon="reset" data-i18n-aria="reset.label" data-i18n-title="reset.title"></button>
  </header>

  <nav id="plugins" class="plugins" data-i18n-aria="plugins.aria"></nav>

  <main class="app">
    <aside id="library" class="library">
      <div class="lib-head">
        <h2 data-i18n="lib.title"></h2>
        <input id="lib-search" type="search" data-i18n-placeholder="lib.search">
      </div>
      <div id="lib-tabs" class="lib-tabs" role="tablist">
        <button data-tab="sounds" data-i18n="lib.tab.sounds" data-i18n-title="lib.tab.sounds.title"></button>
        <button data-tab="fx" data-i18n="lib.tab.fx" data-i18n-title="lib.tab.fx.title"></button>
      </div>
      <div id="lib-cats" class="lib-cats"></div>
      <div id="lib-list" class="lib-list"></div>
      <p class="hint" data-i18n="lib.hint"></p>
    </aside>

    <section id="timeline" class="tl-area">
      <div class="section-title">
        <h2 data-i18n="tl.title"></h2>
        <button id="tl-play" class="primary" data-icon="play"></button>
        <button id="tl-rec" data-icon="rec"></button>
        <label class="tl-src"><span data-i18n="tl.source"></span><select id="tl-source"></select></label>
        <button id="tl-loop" data-icon="loop" data-i18n="tl.loop"></button>
        <span class="tl-bars"><button id="tl-undo" class="icon-only" data-icon="undo" data-i18n-title="tl.undo" data-i18n-aria="tl.undo"></button><button id="tl-redo" class="icon-only" data-icon="redo" data-i18n-title="tl.redo" data-i18n-aria="tl.redo"></button></span>
        <span class="tl-bars"><button id="tl-zoom-out" data-i18n-title="tl.zoomOut">−</button><span data-i18n="tl.zoom"></span><button id="tl-zoom-in" data-i18n-title="tl.zoomIn">+</button></span>
        <span class="tl-bars"><button id="tl-less">−</button><span id="tl-bars"></span><button id="tl-more">+</button></span>
        <span class="tl-bars"><button id="tl-tracks-less" data-i18n-title="tl.removeTrack">−</button><span id="tl-tracks"></span><button id="tl-tracks-more" data-i18n-title="tl.addTrack">+</button></span>
        <span class="tl-bars"><button id="tl-open" class="icon-only" data-icon="folder" data-i18n-title="file.openSong" data-i18n-aria="file.openSong"></button><button id="tl-save" class="icon-only" data-icon="save" data-i18n-title="file.saveSong" data-i18n-aria="file.saveSong"></button></span>
        <button id="tl-demo" data-icon="star" data-i18n="tl.demo" data-i18n-title="tl.demo.title"></button>
        <span class="tl-bars"><button id="tl-export" data-icon="download" data-i18n="export.wav" data-i18n-title="export.wav.title"></button><button id="tl-stems" data-icon="stems" data-i18n="export.stems" data-i18n-title="export.stems.title"></button></span>
        <span class="hint" data-i18n="tl.hint"></span>
      </div>
      <div id="tl-scroll" class="tl-scroll"><div id="tl-grid" class="tl"></div></div>
    </section>
  </main>

  <div id="windows">
    <section class="window grid-area" data-win="pads">
      <div class="section-title">
        <h2 data-i18n="pads.title"></h2>
        <span class="hint" data-i18n="pads.hint"></span>
        <div class="spacer"></div>
        <div class="row">
          <button id="kit-export-bank" data-icon="download" data-i18n="kit.exportBank" data-i18n-title="kit.exportBank.title"></button>
          <button id="kit-export-all" data-icon="download" data-i18n="kit.exportAll" data-i18n-title="kit.exportAll.title"></button>
          <button id="kit-import" data-icon="upload" data-i18n="kit.import" data-i18n-title="kit.import.title"></button>
          <input id="kit-file" type="file" accept=".apckit,.json" hidden>
        </div>
      </div>
      <div class="grid-wrap">
        <div id="pads" class="pads"></div>
        <div id="banks" class="banks" data-i18n-aria="banks.aria"></div>
      </div>
      <div class="pad-knobs">
        <div class="pad-knobs-title"><b id="pad-knobs-name"></b><span class="hint" data-i18n="pads.knobsHint"></span></div>
        <div id="pad-knobs" class="mini-knobs row-knobs"></div>
      </div>
    </section>

    <aside class="window editor" id="editor" data-win="editor">
      <div class="section-title"><h2 id="ed-title">Pad</h2></div>
      <label class="field"><span data-i18n="editor.name"></span>
        <input id="ed-name" type="text" maxlength="24" spellcheck="false">
      </label>
      <canvas id="ed-wave" width="560" height="120"></canvas>
      <div class="row">
        <button id="ed-load" class="primary" data-icon="folder" data-i18n="editor.load"></button>
        <button id="ed-play" data-icon="play" data-i18n="editor.play"></button>
        <button id="ed-clear" data-icon="trash" data-i18n="editor.clear"></button>
        <input id="ed-file" type="file" accept="audio/*" hidden>
      </div>
      <div class="field"><span data-i18n="editor.color"></span>
        <div id="ed-colors" class="swatches"></div>
      </div>
      <div class="field"><span data-i18n="editor.mode"></span>
        <div id="ed-modes" class="segmented"></div>
      </div>
      <div class="field"><span data-i18n="editor.knobs"></span>
        <div id="ed-knobs" class="mini-knobs"></div>
      </div>
      <div class="field"><span data-i18n="editor.bpm"></span>
        <div class="row">
          <input id="ed-bpm" type="number" min="40" max="240" step="0.01" placeholder="—">
          <button id="ed-bpm-auto" data-i18n-title="editor.bpmAuto.title">Auto</button>
        </div>
      </div>
    </aside>

    <section class="window perf-area" data-win="perf">
      <div class="section-title">
        <h2 data-i18n="perf.title"></h2>
        <span class="hint" data-i18n="perf.hint"></span>
      </div>
      <div id="perf" class="perf"></div>
    </section>

    <section class="window tr-area" data-win="tr">
      <div class="section-title">
        <h2>TR-909</h2>
        <button id="tr-play" class="primary" data-icon="play"></button>
        <div id="tr-patterns" class="segmented"></div>
        <label class="tr-accent"><span data-i18n="tr.accent"></span><input id="tr-accent" type="range" min="0" max="100"></label>
        <button id="tr-apc" data-icon="grid" data-i18n="tr.apcMode" data-i18n-title="tr.apcMode.title"></button>
        <span class="hint" data-i18n="tr.hint"></span>
      </div>
      <div id="tr-grid" class="tr-grid"></div>
      <div id="tr-knobs" class="mini-knobs row-knobs tr-knobs"></div>
    </section>

    <section class="window acid-area" data-win="acid">
      <div class="section-title">
        <h2>TB-303</h2>
        <button id="acid-play" class="primary" data-icon="play"></button>
        <div id="acid-patterns" class="segmented"></div>
        <button id="acid-wave" data-icon="w-saw" data-i18n-title="acid.wave.title"></button>
        <button id="acid-link" data-icon="link" data-i18n="acid.link" data-i18n-title="acid.link.title"></button>
        <button id="acid-rec" data-icon="steps" data-i18n="acid.rec" data-i18n-title="acid.rec.title"></button>
        <button id="acid-rest" data-icon="rest" data-i18n="acid.rest" data-i18n-title="acid.rest.title"></button>
        <button id="acid-random" data-icon="dice" data-i18n="acid.random" data-i18n-title="acid.random.title"></button>
        <button id="acid-clear" data-icon="trash" data-i18n="acid.clear" data-i18n-title="acid.clear.title"></button>
      </div>
      <div id="acid-knobs" class="mini-knobs acid-knobs"></div>
      <div id="acid-grid" class="acid-grid"></div>
    </section>

    <section class="window kick-area" data-win="kick">
      <div class="section-title">
        <h2 data-i18n="kick.title"></h2>
      </div>
      <div id="kick-presets" class="preset-list"></div>
      <div id="kick-knobs" class="mini-knobs kick-knobs"></div>
      <div class="kick-wave-wrap"><canvas id="kick-wave" height="90"></canvas><span id="kick-len" class="hint"></span></div>
      <div class="row kick-actions">
        <button id="kick-play" class="primary" data-icon="play" data-i18n="kick.play"></button>
        <button id="kick-auto" data-icon="phones" data-i18n="kick.auto" data-i18n-title="kick.auto.title"></button>
        <span class="spacer"></span>
        <button id="kick-to-pad" data-icon="pads" data-i18n="kick.toPad"></button>
        <button id="kick-to-lib" data-icon="lib" data-i18n="kick.toLib" data-i18n-title="kick.toLib.title"></button>
        <button id="kick-wav" data-icon="download" data-i18n="kick.wav" data-i18n-title="kick.wav.title"></button>
      </div>
    </section>

    <section class="window decks-area" data-win="decks">
      <div class="section-title">
        <h2 data-i18n="deck.title"></h2>
      </div>
      <div class="decks">
        <div class="deck" data-deck="A"></div>
        <div class="deck" data-deck="B"></div>
      </div>
      <label class="deck-xfade"><span>A</span><input id="deck-xfade" type="range" min="0" max="1" step="0.005" data-i18n-title="deck.xfade"><span>B</span></label>
    </section>

    <section class="window patch-area" data-win="patch">
      <div class="section-title">
        <h2 data-i18n="patch.title"></h2>
        <div id="patch-add" class="patch-add"></div>
        <span class="spacer"></span>
        <button id="patch-reset" data-icon="reset" data-i18n="patch.reset" data-i18n-title="patch.reset.title"></button>
      </div>
      <div id="patch-canvas" class="patch-canvas"><svg id="patch-wires" class="patch-wires"></svg></div>
    </section>

    <section class="window scenes-area" data-win="scenes">
      <div class="section-title">
        <h2 data-i18n="scene.title"></h2>
        <button id="scene-save" data-icon="save" data-i18n="scene.saveMode" data-i18n-title="scene.saveMode.title"></button>
        <button id="scene-apc" data-icon="grid" data-i18n="scene.apcMode" data-i18n-title="scene.apcMode.title"></button>
        <span class="hint" data-i18n="scene.hint"></span>
      </div>
      <div id="scenes" class="scenes"></div>
    </section>

    <section class="window mix-area" data-win="mix">
      <div class="section-title">
        <h2 data-i18n="mix.title"></h2>
        <span class="hint" data-i18n="mix.hint"></span>
      </div>
      <div id="sidechain" class="sidechain"></div>
      <div id="mixer" class="mixer"></div>
      <div class="mix-master">
        <div class="mm-group"><span data-i18n="mix.masterEq"></span><div id="master-eq" class="mini-knobs row-knobs"></div></div>
        <div class="mm-group"><span data-i18n="mix.masterFx"></span><div id="master-fx" class="mini-knobs row-knobs"></div></div>
      </div>
    </section>

    <section class="window piano-area" data-win="piano">
      <div class="section-title">
        <h2 data-i18n="piano.title"></h2>
        <button id="synth-kb" class="kb-target" data-icon="keys" data-i18n-title="kb.title"></button>
        <span class="hint" data-i18n="piano.hint"></span>
      </div>
      <div id="synth-families" class="synth-families"></div>
      <div id="presets" class="preset-list" data-i18n-aria="presets.aria"></div>
      <div id="synth-knobs" class="mini-knobs synth-knobs"></div>
      <div id="synth-play" class="synth-play"></div>
      <button id="gen-btn" class="gen-btn" data-icon="wand" data-i18n="gen.button" data-i18n-title="gen.title"></button>
      <div id="gen" class="tl-gen" hidden></div>
      <div id="piano" class="piano"></div>
    </section>

    <section class="window osc-area" data-win="osc">
      <div class="section-title">
        <h2 data-i18n="osc.title"></h2>
        <button id="osc-kb" class="kb-target" data-icon="keys" data-i18n-title="kb.title"></button>
        <button id="osc-test" class="primary" data-icon="play" data-i18n="osc.test" data-i18n-title="osc.test.title"></button>
        <b id="osc-current" class="osc-current"></b>
        <span class="spacer"></span>
        <input id="osc-name" type="text" maxlength="24" spellcheck="false" data-i18n-placeholder="osc.namePh">
        <button id="osc-save" data-icon="save" data-i18n="osc.save" data-i18n-title="osc.save.title"></button>
        <button id="osc-del" data-icon="trash" class="icon-only" data-i18n-title="osc.del.title" data-i18n-aria="osc.del.title"></button>
      </div>
      <div id="osc-presets" class="preset-list osc-presets"></div>
      <div id="osc-modules" class="osc-modules"></div>
    </section>

    <section class="window viz-area" data-win="viz">
      <div class="section-title">
        <h2 data-i18n="viz.title"></h2>
        <div id="viz-modes" class="viz-modes"></div>
        <b id="viz-current" class="viz-current"></b>
        <input id="viz-words" type="text" maxlength="200" spellcheck="false" data-i18n-placeholder="viz.words" data-i18n-title="viz.words.title">
        <span class="spacer"></span>
        <div id="viz-fx" class="viz-fx"></div>
        <button id="viz-auto" class="icon-only" data-icon="loop" data-i18n-aria="viz.auto" data-i18n-title="viz.auto.title"></button>
        <button id="viz-full" class="icon-only" data-icon="fullscreen" data-i18n-aria="viz.full" data-i18n-title="viz.full.title"></button>
        <button id="viz-proj" data-icon="projector" data-i18n="viz.projector" data-i18n-title="viz.projector.title"></button>
      </div>
      <div id="viz-stage" class="viz-stage"><canvas id="viz-canvas"></canvas><div id="viz-label" class="viz-label"></div></div>
      <div id="viz-knobs" class="mini-knobs row-knobs viz-knobs"></div>
    </section>

    <section class="window roll-area" data-win="roll">
      <div class="section-title">
        <h2 data-i18n="roll.title"></h2>
        <button id="roll-play" class="primary" data-icon="play"></button>
        <button id="roll-new" data-icon="plus" data-i18n="roll.new" data-i18n-title="roll.new.title"></button>
        <select id="roll-preset" data-i18n-title="roll.preset.title"></select>
        <span class="tl-bars" data-i18n-title="roll.len.title"><button id="roll-shorter">−</button><span id="roll-len"></span><button id="roll-longer">+</button></span>
        <label class="roll-field"><span data-i18n="roll.grid"></span><select id="roll-grid"></select></label>
        <button id="roll-quant" data-icon="magnet" data-i18n="roll.quant" data-i18n-title="roll.quant.title"></button>
        <button id="roll-merge" data-icon="merge" data-i18n="roll.merge" data-i18n-title="roll.merge.title"></button>
        <button id="roll-step" data-icon="steps" data-i18n="roll.step" data-i18n-title="roll.step.title"></button>
      </div>
      <div class="roll-info">
        <input id="roll-name" type="text" maxlength="24" spellcheck="false" data-i18n-title="roll.name.title">
        <span id="roll-where" class="hint"></span>
        <span class="hint roll-hint" data-i18n="roll.hint"></span>
      </div>
      <div class="roll-view"><canvas id="roll-canvas"></canvas><div id="roll-empty" class="roll-empty" data-i18n="roll.empty"></div></div>
    </section>

    <section class="window monitor" data-win="monitor">
      <div class="section-title">
        <h2 data-i18n="monitor.title"></h2>
        <span id="ports" class="hint"></span>
      </div>
      <div class="row"><button id="swap-roles" hidden data-icon="swap" data-i18n="monitor.swap"></button></div>
      <pre id="log"></pre>
    </section>
  </div>

  <footer>GabberKey · © 2026 Guillaume Monet · MIT</footer>

  <!-- Version des scripts : à incrémenter pour contourner les anciens caches des navigateurs. -->
  <script type="importmap">
  {
    "imports": {
      "./js/acid.js": "./js/acid.js?v=48",
      "./js/apc.js": "./js/apc.js?v=48",
      "./js/audio.js": "./js/audio.js?v=48",
      "./js/decks.js": "./js/decks.js?v=48",
      "./js/chords.js": "./js/chords.js?v=48",
      "./js/help.js": "./js/help.js?v=48",
      "./js/history.js": "./js/history.js?v=48",
      "./js/i18n.js": "./js/i18n.js?v=48",
      "./js/kickdesign.js": "./js/kickdesign.js?v=48",
      "./js/kit.js": "./js/kit.js?v=48",
      "./js/kits.js": "./js/kits.js?v=48",
      "./js/library.js": "./js/library.js?v=48",
      "./js/main.js": "./js/main.js?v=48",
      "./js/mixer.js": "./js/mixer.js?v=48",
      "./js/notes.js": "./js/notes.js?v=48",
      "./js/osc.js": "./js/osc.js?v=48",
      "./js/params.js": "./js/params.js?v=48",
      "./js/patch.js": "./js/patch.js?v=48",
      "./js/performer.js": "./js/performer.js?v=48",
      "./js/pianoroll.js": "./js/pianoroll.js?v=48",
      "./js/presets.js": "./js/presets.js?v=48",
      "./js/project.js": "./js/project.js?v=48",
      "./js/sidechain.js": "./js/sidechain.js?v=48",
      "./js/recorder.js": "./js/recorder.js?v=48",
      "./js/timeline.js": "./js/timeline.js?v=48",
      "./js/storage.js": "./js/storage.js?v=48",
      "./js/tr909.js": "./js/tr909.js?v=48",
      "./js/trackfx.js": "./js/trackfx.js?v=48",
      "./js/visualizer.js": "./js/visualizer.js?v=48",
      "./js/viz3d.js": "./js/viz3d.js?v=48",
      "./js/windows.js": "./js/windows.js?v=48",
      "./js/zip.js": "./js/zip.js?v=48"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=48"></script>
</body>
</html>
